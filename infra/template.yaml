AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mock-exam generator serverless backend

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Deployment environment.
  AuthCallbackUrl:
    Type: String
    Default: http://localhost:5173/callback
    Description: Callback URL registered on the user pool app client.
  AuthLogoutUrl:
    Type: String
    Default: http://localhost:5173
    Description: Logout URL registered on the user pool app client.
  SignupMode:
    Type: String
    Default: open
    AllowedValues:
      - open
      - invite
    Description: Sign-up policy. "invite" limits new sign-ups to emails and domains on the BetaAllowlist.
  BetaAllowlist:
    Type: String
    Default: ''
    Description: Comma-separated emails and domains allowed to sign up while SignupMode is "invite".
  BedrockModelDefault:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Default Bedrock model used when a certification does not specify one.
  ExamGenerationV2:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable the V2 (concept-planner-backed) exam generation workflow. Defaults to off.
  ApiThrottleRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second per API stage.
  ApiThrottleBurstLimit:
    Type: Number
    Default: 100
    Description: Burst requests allowed per API stage.
  WafRateLimit:
    Type: Number
    Default: 3000
    Description: Maximum requests allowed from a single IP within a 5-minute window.
  AllowedOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Comma-separated list of origins allowed to call the public API (CORS).
  GoogleClientId:
    Type: String
    Default: ''
    Description: Google OAuth client ID for federated sign-in. Leave empty to disable the Google IdP.
  GoogleClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Google OAuth client secret for federated sign-in. Leave empty to disable the Google IdP.
  AppleServicesId:
    Type: String
    Default: ''
    Description: Apple Services ID for Sign in with Apple. Leave empty to disable the Apple IdP.
  AppleTeamId:
    Type: String
    Default: ''
    Description: Apple team ID that owns the Sign in with Apple Services ID.
  AppleKeyId:
    Type: String
    Default: ''
    Description: Key ID of the private key used to sign Sign in with Apple client assertions.
  ApplePrivateKeySecretArn:
    Type: String
    Default: ''
    NoEcho: true
    Description: ARN of the Secrets Manager secret holding the Sign in with Apple private key (.p8).

Globals:
  Function:
    Runtime: nodejs22.x
    Handler: index.handler
    MemorySize: 1024
    Timeout: 30
    Tracing: Active
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:580247275435:layer:LambdaInsightsExtension:21
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: exam-generator
        BEDROCK_MODEL_DEFAULT: !Ref BedrockModelDefault
        DYNAMODB_CERTIFICATIONS_TABLE: !Ref CertificationsTable
        DYNAMODB_EXAMS_TABLE: !Ref ExamsTable
        DYNAMODB_USERS_TABLE: !Ref UsersTable
        SQS_GENERATOR_QUEUE_URL: !Ref GeneratorQueue
        S3_ARTIFACTS_BUCKET: !Ref ExamArtifactsBucket
        PRESIGNED_URL_EXPIRATION_SECONDS: '300'
        ALLOWED_ORIGINS: !Ref AllowedOrigins
    Tags:
      Project: exam-generator
      Environment: !Ref Environment

Conditions:
  GoogleIdpEnabled: !And
    - !Not [!Equals [!Ref GoogleClientId, '']]
    - !Not [!Equals [!Ref GoogleClientSecret, '']]
  AppleIdpEnabled: !And
    - !Not [!Equals [!Ref AppleServicesId, '']]
    - !Not [!Equals [!Ref AppleTeamId, '']]
    - !Not [!Equals [!Ref AppleKeyId, '']]
    - !Not [!Equals [!Ref ApplePrivateKeySecretArn, '']]

Resources:
  # ---------------------------------------------------------------------------
  # Public API
  # ---------------------------------------------------------------------------
  PublicApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-public-api
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit

  # ---------------------------------------------------------------------------
  # Cognito identity
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      LambdaConfig:
        PreSignUp: !GetAtt LoginTriggerFunction.Arn
        PostConfirmation: !GetAtt LoginTriggerFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - !If [GoogleIdpEnabled, !Ref GoogleIdentityProvider, !Ref 'AWS::NoValue']
        - !If [AppleIdpEnabled, !Ref AppleIdentityProvider, !Ref 'AWS::NoValue']
      CallbackURLs:
        - !Ref AuthCallbackUrl
      LogoutURLs:
        - !Ref AuthLogoutUrl
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${AWS::StackName}-auth
      UserPoolId: !Ref UserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: GoogleIdpEnabled
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'email profile openid'
      AttributeMapping:
        email: email

  AppleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: AppleIdpEnabled
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      ProviderDetails:
        client_id: !Ref AppleServicesId
        team_id: !Ref AppleTeamId
        key_id: !Ref AppleKeyId
        private_key: !Ref ApplePrivateKeySecretArn
        authorize_scopes: 'email name'
      AttributeMapping:
        email: email

  # PublicApiWafAcl:
  #   Type: AWS::WAFv2::WebACL
  #   Properties:
  #     Name: !Sub ${AWS::StackName}-public-api-waf
  #     Description: Rate-based protection for the public API.
  #     Scope: REGIONAL
  #     DefaultAction:
  #       Allow: {}
  #     CustomResponseBodies:
  #       RateLimitExceeded:
  #         ContentType: APPLICATION_JSON
  #         Content: '{"error":"RateLimitExceeded","message":"Too many requests from this IP. Please slow down."}'
  #     VisibilityConfig:
  #       SampledRequestsEnabled: true
  #       CloudWatchMetricsEnabled: true
  #       MetricName: !Sub ${AWS::StackName}-public-api-waf
  #     Rules:
  #       - Name: RateLimitRule
  #         Priority: 1
  #         Statement:
  #           RateBasedStatement:
  #             Limit: !Ref WafRateLimit
  #             AggregateKeyType: IP
  #         Action:
  #           Block:
  #             CustomResponse:
  #               ResponseCode: 429
  #               CustomResponseBodyKey: RateLimitExceeded
  #         VisibilityConfig:
  #           SampledRequestsEnabled: true
  #           CloudWatchMetricsEnabled: true
  #           MetricName: !Sub ${AWS::StackName}-public-api-waf-rate-limit
  #     Tags:
  #       - Key: Project
  #         Value: exam-generator

  # PublicApiWafAssociation:
  #   Type: AWS::WAFv2::WebACLAssociation
  #   Properties:
  #     ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${PublicApi}/stages/${Environment}
  #     WebACLArn: !GetAtt PublicApiWafAcl.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/api/index.ts
        Loader:
          - .ts=ts
    Properties:
      CodeUri: ../
      Description: HTTP API handler for certifications and exams.
      Environment:
        Variables:
          COGNITO_USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Events:
        HealthEvent:
          Type: Api
          Properties:
            Path: /v1/health
            Method: GET
            RestApiId: !Ref PublicApi
            Auth:
              Authorizer: NONE
        PreflightEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: OPTIONS
            RestApiId: !Ref PublicApi
            Auth:
              Authorizer: NONE
        ForgotPasswordEvent:
          Type: Api
          Properties:
            Path: /v1/auth/forgot-password
            Method: POST
            RestApiId: !Ref PublicApi
            Auth:
              Authorizer: NONE
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref PublicApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CertificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt GeneratorQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref ExamArtifactsBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
            - Effect: Allow
              Action:
                - cognito-idp:ForgotPassword
              Resource: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------------------
  # Cognito login triggers
  # ---------------------------------------------------------------------------
  LoginTriggerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/authTriggers/index.ts
        Loader:
          - .ts=ts
    Properties:
      CodeUri: ../
      Description: Enforces the one-email-one-account lock and invite-only sign-ups, and provisions user rows.
      Environment:
        Variables:
          SIGNUP_MODE: !Ref SignupMode
          BETA_ALLOWLIST: !Ref BetaAllowlist
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  LoginTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LoginTriggerFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------------------
  # Asynchronous exam generator
  # ---------------------------------------------------------------------------
  GeneratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/generator/index.ts
        Loader:
          - .ts=ts
    Properties:
      CodeUri: ../
      Description: SQS worker that generates exam questions, renders the PDF, and uploads artifacts.
# Lambda timeout: must stay below the queue's VisibilityTimeout so an in-flight exam is
# not redelivered while the worker still runs (redelivery + maxReceiveCount would DLQ it).
      Timeout: 600
      MemorySize: 2048
      Environment:
        Variables:
          EXAM_GENERATION_V2: !Ref ExamGenerationV2
      Events:
        SqsEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt GeneratorQueue.Arn
            BatchSize: 1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CertificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamsTable
        - S3CrudPolicy:
            BucketName: !Ref ExamArtifactsBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'

  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  CertificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-certifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: provider
          AttributeType: S
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProviderCodeIndex
          KeySchema:
            - AttributeName: provider
              KeyType: HASH
            - AttributeName: code
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: exam-generator

  ExamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-exams
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: certificationId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CertificationIdIndex
          KeySchema:
            - AttributeName: certificationId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: OwnerCreatedAtIndex
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: exam-generator

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: exam-generator

  GeneratorQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-generator-queue
      # Must exceed the GeneratorFunction Timeout (600s) so a long-running exam is not
      # redelivered mid-flight; keeps the visibility horizon past any single worker run.
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GeneratorDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: exam-generator

  GeneratorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-generator-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: exam-generator

  ExamArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: exam-generator

Outputs:
  ApiUrl:
    Description: Public API endpoint
    Value: !Sub https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
  UserPoolId:
    Description: Cognito user pool for user sign-ups
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client used by the client application
    Value: !Ref UserPoolClient
  AuthDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  GeneratorQueueUrl:
    Description: Generator SQS queue URL
    Value: !Ref GeneratorQueue
  ExamArtifactsBucketName:
    Description: S3 bucket for exam artifacts
    Value: !Ref ExamArtifactsBucket
  CertificationsTableName:
    Description: DynamoDB certifications table
    Value: !Ref CertificationsTable
  ExamsTableName:
    Description: DynamoDB exams table
    Value: !Ref ExamsTable
  UsersTableName:
    Description: DynamoDB users table
    Value: !Ref UsersTable
