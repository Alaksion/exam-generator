AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bootstrap one AWS account for GitHub Actions SAM deploys: a deploy role that
  the repo's dispatched workflow assumes. The GitHub OIDC provider lives in the
  common infra repo. Deploy once per environment account (dev/staging/prod).

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: >-
      The GitHub environment this account serves. Scopes the role's trust policy
      so the role can only be assumed by this repo on this environment.
  RoleName:
    Type: String
    Default: github-actions-deploy
    Description: Name of the IAM role assumed by GitHub Actions.

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub
                - arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
                - {}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub's OIDC subject varies by event (workflow_dispatch may
              # emit a ref:- or environment:-based sub), so scope to the repo
              # rather than a fixed suffix. Each environment's role lives in its
              # own account, so this still cannot cross accounts.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:Alaksion@30579274/exam-generator@1314515687:environment:${Environment}'
      # SAM deploys touch CloudFormation, IAM, Lambda, API Gateway, Cognito,
      # DynamoDB, SQS, S3, Bedrock, and Secrets Manager. AdministratorAccess is
      # the pragmatic start for an account-scoped, OIDC-locked role; swap it for
      # a least-privilege policy after launch if desired.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      MaxSessionDuration: 3600
      Tags:
        - Key: Project
          Value: exam-generator
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_ROLE_TO_ASSUME secret for the GitHub environment.
    Value: !GetAtt DeployRole.Arn
