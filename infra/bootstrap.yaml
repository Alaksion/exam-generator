AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bootstrap one AWS account for GitHub Actions SAM deploys: the GitHub OIDC
  provider and a deploy role that the repo's dispatched workflow assumes.
  Deploy once per environment account (dev/staging/prod).

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: >-
      The GitHub environment this account serves. Scopes the role's trust policy
      so the role can only be assumed by this repo on this environment.
  GitHubOrg:
    Type: String
    Default: Alaksion
    Description: GitHub org/owner that runs the deploy workflow.
  GitHubRepo:
    Type: String
    Default: exam-generator
    Description: GitHub repository that runs the deploy workflow.
  RoleName:
    Type: String
    Default: github-actions-deploy
    Description: Name of the IAM role assumed by GitHub Actions.
  OidcThumbprint:
    Type: String
    Default: 1b511abead59c6ce207077c0bf0e0043b1382612
    Description: >-
      SHA-1 fingerprint of the GitHub Actions OIDC server certificate.

Resources:
  GithubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - !Ref OidcThumbprint
      Tags:
        - Key: Project
          Value: exam-generator
        - Key: Environment
          Value: !Ref Environment

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GithubActionsOidcProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub's OIDC subject varies by event (workflow_dispatch may
              # emit a ref:- or environment:-based sub), so scope to the repo
              # rather than a fixed suffix. Each environment's role lives in its
              # own account, so this still cannot cross accounts.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      # SAM deploys touch CloudFormation, IAM, Lambda, API Gateway, Cognito,
      # DynamoDB, SQS, S3, Bedrock, and Secrets Manager. AdministratorAccess is
      # the pragmatic start for an account-scoped, OIDC-locked role; swap it for
      # a least-privilege policy after launch if desired.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      MaxSessionDuration: 3600
      Tags:
        - Key: Project
          Value: exam-generator
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_ROLE_TO_ASSUME secret for the GitHub environment.
    Value: !GetAtt DeployRole.Arn
  OidcProviderArn:
    Description: The GitHub Actions OIDC provider ARN for this account.
    Value: !GetAtt GithubActionsOidcProvider.Arn
